<!doctype html>
<html lang="en">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>
    Public debt change | PublicDebt.eu
  </title>

  <meta
    name="robots"
    content="noindex,follow"
  >

  <meta
    name="theme-color"
    content="#171717"
  >

  <link
    rel="stylesheet"
    href="/embed.css"
  >

</head>

<body
  class="embed-body"
  data-theme="dark"
>

  <main class="debt-clock-embed">

    <div class="debt-clock-embed-header">

      <p class="debt-clock-embed-kicker">
        ESTIMATED CHANGE IN PUBLIC DEBT
      </p>

      <strong
        class="debt-clock-embed-country"
        id="embed-country"
      >
        —
      </strong>

    </div>


    <div class="debt-clock-embed-rate">

      <span class="debt-clock-embed-rate-label">
        Rate of change
      </span>

      <strong id="embed-debt-rate">
        —
      </strong>

      <span id="embed-debt-rate-unit">
        —
      </span>

    </div>


    <p
      class="debt-clock-embed-trend"
      id="embed-debt-trend"
    >
      —
    </p>


    <div class="debt-clock-embed-live">

      <strong id="embed-debt-value">
        —
      </strong>

      <span>
        Since you opened this page
      </span>

    </div>


    <div class="debt-clock-embed-footer">

      <p id="embed-debt-method">
        Approximate calculation of the year-on-year change in debt.
      </p>

      <a
        href="/en/"
        target="_blank"
        rel="noopener noreferrer"
        id="embed-source-link"
      >
        PublicDebt.eu

        <span aria-hidden="true">
          ↗
        </span>

      </a>

    </div>

  </main>


  <script src="/embed-debt-clock.js"></script>

</body>

</html>
